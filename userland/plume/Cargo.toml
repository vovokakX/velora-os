[package]
name = "plume"
description = "Plume, a nano-like text editor for the console"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "../build-support.rs"

[[bin]]
name = "plume"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vlibc = { path = "../../libc/vlibc" }
velora-editor = { path = "../../libc/editor" }
coreutils = { path = "../coreutils" }
