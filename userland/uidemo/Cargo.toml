[package]
name = "uidemo"
description = "Shows every widget of velora-ui on the screen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "../build-support.rs"

[[bin]]
name = "uidemo"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vlibc = { path = "../../libc/vlibc" }
velora-ui = { path = "../../libc/ui", features = ["velora"] }
