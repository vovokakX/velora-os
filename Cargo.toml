[workspace]
resolver = "3"
members = ["kernel", "kernel/mm", "kernel/acpi", "kernel/abi", "kernel/exe", "drivers/input", "drivers/pci", "drivers/rtc", "fs/fat", "fs/tar", "fs/vfs", "fs/velorafs", "libc/auth", "libc/shell", "tools/mkiso", "tools/mkinitrd", "tools/fsck", "tools/mkpasswd"]
# The kernel only builds for x86_64-unknown-none, so host commands
# (`cargo test`, `cargo build`) default to the host-side crates.
default-members = ["kernel/mm", "kernel/acpi", "kernel/abi", "kernel/exe", "drivers/input", "drivers/pci", "drivers/rtc", "fs/fat", "fs/tar", "fs/vfs", "fs/velorafs", "libc/auth", "libc/shell", "tools/mkiso", "tools/mkinitrd", "tools/fsck", "tools/mkpasswd"]
# User programs and vlibc have their own workspace (userland/) and target flags.
exclude = ["userland", "libc/vlibc"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/vovokakX/velora-os"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 1
opt-level = 2
