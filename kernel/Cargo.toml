[package]
name = "velora-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "velora"
path = "src/main.rs"
test = false
bench = false

[features]
# Build the in-kernel test runner instead of the normal boot path.
ktest = ["dep:velora-auth"]

[dependencies]
velora-mm = { path = "mm" }
velora-acpi = { path = "acpi" }
velora-abi = { path = "abi" }
velora-exe = { path = "exe" }
velora-tar = { path = "../fs/tar" }
velora-vfs = { path = "../fs/vfs" }
velora-fat = { path = "../fs/fat" }
velorafs = { path = "../fs/velorafs" }
velora-gpt = { path = "../fs/gpt" }
velora-net = { path = "net" }
velora-gfx = { path = "gfx" }
velora-tty = { path = "tty" }
# Only the kernel tests read /etc/shadow.
velora-auth = { path = "../libc/auth", optional = true }
velora-pci = { path = "../drivers/pci" }
velora-rtc = { path = "../drivers/rtc" }
velora-input = { path = "../drivers/input" }
velora-usb = { path = "../drivers/usb" }
