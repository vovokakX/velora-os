name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf unzip

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM, tests will use TCG"

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: |
          cargo fmt --all -- --check
          (cd userland && cargo fmt --all -- --check)

      - name: Clippy (host crates)
        run: cargo clippy --workspace --exclude velora-kernel -- -D warnings

      - name: Clippy (kernel)
        run: |
          cargo clippy -p velora-kernel --target x86_64-unknown-none -- -D warnings
          cargo clippy -p velora-kernel --target x86_64-unknown-none --features ktest -- -D warnings

      - name: Clippy (user programs and vlibc)
        working-directory: userland
        env:
          CARGO_TARGET_DIR: ../target/user
          RUSTFLAGS: -C relocation-model=static -C force-frame-pointers=yes
        run: |
          cargo clippy --target x86_64-unknown-none -- -D warnings
          cargo clippy --manifest-path ../libc/vlibc/Cargo.toml --target x86_64-unknown-none --features cabi -- -D warnings

      - name: Tests (host unit tests, kernel tests in QEMU, boot test)
        env:
          VELORA_QEMU_EXTRA: -trace virtio_queue_notify -trace virtio_set_status -trace virtio_blk_* -trace virtqueue_pop
        run: ./test.sh

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: velora-iso
          path: velora.iso
          if-no-files-found: error

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs
          path: build/logs/
          if-no-files-found: ignore

  # Temporary (issue #19): the kernel tests under KVM with a newer QEMU.
  kvm-newer-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: fedora:41
      options: --device /dev/kvm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          dnf install -y qemu-system-x86-core edk2-ovmf python3 unzip curl gcc git findutils
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          qemu-system-x86_64 --version
          ls /usr/share/edk2/ovmf/ /usr/share/qemu | head -40
      - name: Kernel tests in QEMU
        env:
          VELORA_QEMU_EXTRA: -trace virtio_set_status -trace virtio_blk_data_plane_start -trace virtio_queue_notify
        run: |
          ./build.sh --test
          python3 tests/qemu_run.py ktest --timeout 300
