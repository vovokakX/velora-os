name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs in Fedora for a current QEMU (9.x): with QEMU 8.2 from Ubuntu
  # 24.04 the virtio-blk driver gets no completions (issue #19).
  build-and-test:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: fedora:41
      options: --device /dev/kvm
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU, UEFI firmware and Rust
        run: |
          dnf install -y qemu-system-x86-core edk2-ovmf python3 unzip curl gcc git findutils dosfstools
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          qemu-system-x86_64 --version
          rustup show active-toolchain || rustup toolchain install
          ls -l /dev/kvm || echo "no KVM, tests will use TCG"

      - name: Format check
        run: |
          cargo fmt --all -- --check
          (cd userland && cargo fmt --all -- --check)

      - name: Clippy (host crates)
        run: cargo clippy --workspace --exclude velora-kernel -- -D warnings

      - name: Clippy (kernel)
        run: |
          cargo clippy -p velora-kernel --target x86_64-unknown-none -- -D warnings
          cargo clippy -p velora-kernel --target x86_64-unknown-none --features ktest -- -D warnings

      - name: Clippy (user programs and vlibc)
        working-directory: userland
        env:
          CARGO_TARGET_DIR: ../target/user
          RUSTFLAGS: -C relocation-model=static -C force-frame-pointers=yes
        run: |
          cargo clippy --target x86_64-unknown-none -- -D warnings
          cargo clippy --manifest-path ../libc/vlibc/Cargo.toml --target x86_64-unknown-none --features cabi -- -D warnings

      - name: Tests (host unit tests, kernel tests in QEMU, boot test)
        run: ./test.sh

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: velora-iso
          path: velora.iso
          if-no-files-found: error

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs
          path: build/logs/
          if-no-files-found: ignore

      # The kernels of this run, to turn addresses in a failure report
      # into function names (llvm-objdump --syms, llvm-addr2line).
      - name: Upload kernel images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-elf
          path: build/*.elf
          if-no-files-found: ignore
