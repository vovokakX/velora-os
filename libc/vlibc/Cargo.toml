[package]
name = "vlibc"
description = "Velora C-library-level runtime for user programs: startup, system calls, I/O, heap, processes"
version = "0.15.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false

[dependencies]
velora-abi = { path = "../../kernel/abi" }
velora-mm = { path = "../../kernel/mm" }

[features]
# Export a small C API (exit, write, read, malloc, free, ...) for C programs.
cabi = []
